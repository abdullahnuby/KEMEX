name: KEMEX Release Gates

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target verification environment'
        required: true
        default: staging
        type: choice
        options: [staging, production]

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:source
      - run: npm run verify:migrations
      - run: npm run test:security:static
      - run: npm run test:enterprise-sprint
      - run: npm run typecheck
      - run: npm run build
      - name: Production schema smoke check
        if: ${{ secrets.KEMEX_SUPABASE_URL != '' && secrets.KEMEX_SUPABASE_SERVICE_KEY != '' }}
        env:
          KEMEX_SUPABASE_URL: ${{ secrets.KEMEX_SUPABASE_URL }}
          KEMEX_SUPABASE_SERVICE_KEY: ${{ secrets.KEMEX_SUPABASE_SERVICE_KEY }}
        run: npm run verify:production
