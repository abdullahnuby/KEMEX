<style>

.lcard{background:#fff;border-radius:16px;padding:30px;width:100%;max-width:410px;box-shadow:0 25px 60px rgba(2,20,30,.5);text-align:center}

.lusers button{display:flex;flex-direction:column;align-items:center;padding:7px 5px;border:1px solid var(--line);border-radius:8px;background:#f8fafc;font-size:12px}

.lform{text-align:right;margin-top:14px}
.lform label{display:block;font-size:12px;font-weight:700;margin:8px 0 3px}
.side{position:fixed;top:0;right:0;bottom:0;width:255px;background:linear-gradient(180deg,var(--side),#123240);color:#cfe8f0;overflow-y:auto;z-index:60}
.brand{display:flex;gap:9px;align-items:center;padding:15px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand b{font-size:14px;display:block}.brand span{font-size:10.5px;color:#8fc3d4;display:block}
.ng{padding:13px 17px 4px;font-size:11px;color:#7fb3c6;font-weight:700}
.nl{display:flex;align-items:center;gap:9px;padding:6px 17px;color:#d7ecf3;text-decoration:none;font-size:13px;border-right:3px solid transparent}

.main{margin-right:255px;min-height:100vh;display:flex;flex-direction:column}

.uc{font-size:13px;font-weight:700}.uc i{font-style:normal;font-size:10.5px;color:var(--mut)}
.cont{padding:18px;flex:1}
.menu{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:16px}
.offb{background:#fff7ed;border-bottom:1px solid #fed7aa;color:#92400e;padding:6px 18px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:6px 13px;border:1px solid transparent;font-weight:700;font-size:12.5px}
.bp{background:var(--p);color:#fff}.bp:hover{background:var(--pd)}
.bo{background:#fff;border-color:var(--line);color:#334155}.bo:hover{border-color:var(--p)}
.bs{background:#059669;color:#fff}.bd{background:#fee2e2;color:#b91c1c}
.bx{padding:3px 9px;font-size:11.5px;border-radius:7px}
.card{background:#fff;border:1px solid var(--line);border-radius:11px;margin-bottom:14px}
.chh{padding:9px 14px;border-bottom:1px solid var(--line);font-weight:800;font-size:13px}
.cb{padding:12px 14px}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;display:flex;gap:10px}
.kpi .v{font-size:18px;font-weight:800}.kpi .l{font-size:12.5px;font-weight:700;color:#334155}.kpi .s{font-size:11px;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1.1fr 1.3fr 1fr;gap:14px}
.bdg{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.bg-green{background:#dcfce7;color:#15803d}.bg-blue{background:#dbeafe;color:#1d4ed8}.bg-orange{background:#fef3c7;color:#b45309}.bg-red{background:#fee2e2;color:#b91c1c}.bg-purple{background:#ede9fe;color:#6d28d9}.bg-teal{background:#ccfbf1;color:#0f766e}.bg-gray{background:#e2e8f0;color:#475569}
.tb{display:flex;gap:9px;align-items:center;margin-bottom:9px}
.ts{max-width:250px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:600px}
th{background:#f1f5f9;padding:8px 9px;text-align:right;font-weight:800;color:#334155;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px}
td{padding:7px 9px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#f8fafc}
tr.rl{cursor:pointer}
td.ac{white-space:nowrap}
.em{text-align:center;color:var(--mut);padding:22px}
.pg{display:flex;gap:4px;margin-top:9px;flex-wrap:wrap}

.pg .on{background:var(--p);color:#fff;border-color:var(--p)}
.mn{min-width:0;font-size:12.5px}
.mn td{border-bottom:1px dashed #eef2f6;padding:5px 4px}
.mn td:last-child{text-align:left;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(8,25,38,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:14px}
.dl{background:#fff;border-radius:13px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 25px 70px rgba(0,0,0,.35)}
.dl.w{max-width:780px}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dh h3{font-size:14.5px}
.dh button{background:none;border:none;font-size:15px;color:var(--mut)}
.db{padding:14px 16px;overflow-y:auto}
.df{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fi label{display:block;font-size:11.5px;font-weight:700;margin-bottom:3px;color:#334155}
.fi.s2{grid-column:span 2}
.tbs{display:flex;gap:5px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px;margin-bottom:12px;flex-wrap:wrap}
.tbs button{border:none;background:none;padding:6px 13px;border-radius:7px;font-weight:700;font-size:12.5px;color:#475569}
.tbs .on{background:var(--p);color:#fff}
.fd{display:grid;grid-template-columns:150px 1fr;gap:3px 12px;font-size:12.8px;background:#f8fafc;border:1px dashed var(--line);border-radius:9px;padding:11px 13px}
.fd b{color:#334155;font-size:11.5px}
.al{display:flex;flex-direction:column;gap:6px}
.ai{display:flex;flex-direction:column;border:1px solid var(--line);border-right:3px solid #16a34a;border-radius:8px;padding:7px 10px;font-size:12.3px;color:var(--ink);text-decoration:none}
.ai b{font-size:12.5px}
.sev1{border-right-color:#dc2626}.sev2{border-right-color:#d97706}.sev3{border-right-color:#16a34a}
.pl{display:flex;flex-direction:column;gap:7px}
.pl a{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 11px;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:600}
.alnk{display:block;text-align:center;margin-top:8px;font-size:12px;color:var(--p);text-decoration:none;font-weight:700}
.fb{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:12px;flex-wrap:wrap}
.fb input,.fb select{width:auto;min-width:120px}
.fb .lb{font-size:12px;font-weight:700;color:#334155}
.chip{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;background:#f0fdf4;color:#15803d;cursor:pointer;white-space:nowrap}
.chip.of{background:#fff7ed;color:#b45309}
.tr{position:fixed;bottom:16px;left:16px;display:flex;flex-direction:column;gap:7px;z-index:200}
.tt{background:#0f172a;color:#fff;padding:10px 16px;border-radius:9px;font-size:12.5px}
.tt.e{background:#991b1b}.tt.w{background:#92400e}
.rm{font-size:11.5px;color:var(--mut);margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}
@media(max-width:1150px){.g3{grid-template-columns:1fr 1fr}}
@media(max-width:1000px){.side{display:none}.main{margin-right:0}.menu{display:inline-block}}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.fg{grid-template-columns:1fr}.fi.s2{grid-column:span 1}}
@media print{.side,.top,.offb,.no-p,.tr,.pg,.tb,.fb{display:none!important}.main{margin:0}.cont{padding:0}}
</style>
</head>
<body>

<div id="app"></div><div id="mr"></div><div id="tr" class="tr"></div>
<script>
/* ===== الكتلة 1: النواة ===== */
var LSK='tfms_v6',SSK='tfms_session',CH={},TB={},SESSION=null,SIM=false,DB=null,MEMO={};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return(MEMO[k]===undefined?null:MEMO[k])}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){MEMO[k]=v}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){delete MEMO[k]}}
function $(s,r){r=r||document;return r.querySelector(s)}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function addD(ds,n){var d=new Date(ds);d.setDate(d.getDate()+n);return iso(d)}
function dLeft(ds){return Math.ceil((new Date(ds)-new Date(today()))/864e5)}
function uid(p){return p+Math.random().toString(36).slice(2,8)}
function fN(n,d){n=+(n||0);d=(d==null?0:d);return n.toLocaleString('en-US',{maximumFractionDigits:d})}
function fM(n){return fN(n)+' ج.م'}
function fD(ds){if(!ds)return'—';var d=new Date(ds);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()}
function fDT(ds){if(!ds)return'—';var d=new Date(ds);return fD(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function esc(s){s=String(s==null?'':s);return s.replace(/[&<>"]/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;'})}
function toast(m,t){
 var r=$('#tr');if(!r)return;
 var e=document.createElement('div');e.className='tt'+(t?' '+t:'');e.textContent=m;
 r.appendChild(e);setTimeout(function(){e.remove()},4000)}
function chart(id,cfg){
 var el=document.getElementById(id);if(!el||!window.Chart)return;
 if(CH[id])CH[id].destroy();CH[id]=new Chart(el,cfg)}
if(window.Chart){Chart.defaults.font.family='Cairo, Tahoma'}
function bg(t,c){return '<span class="bdg bg-'+c+'">'+t+'</span>'}
var CLR={'متاح':'green','محجوز':'orange','مخصص لمشروع':'blue','يعمل':'teal','متوقف مؤقتًا':'orange','تحت الصيانة':'purple','خارج الخدمة':'gray','بانتظار الفحص':'orange','بانتظار الإصلاح':'red','معاد إلى المؤجر':'gray','مستبعد من الخدمة':'gray','ساري':'green','منتهي':'gray','قيد التجديد':'orange','مسودة':'gray','مقدمة':'blue','معتمد':'green','معتمدة':'green','معادة':'orange','مرفوض':'red','مرفوضة':'red','مكتمل':'teal','مكتملة':'teal','قيد التنفيذ':'blue','بانتظار اعتماد مدير المشروع':'blue','معتمد من مدير المشروع':'teal','قيد الاعتماد':'blue','بانتظار مراجعة':'orange','بانتظار قطع غيار':'orange','بانتظار الاعتماد':'orange','مرحلة':'teal','مدفوعة':'green','محصلة':'green','مسجلة':'gray','أمر شراء':'teal','مفتوح':'orange','ملغى':'gray','بالخدمة':'green','مخزن':'blue','يحتاج فحص':'orange','قيد الإصلاح':'purple','مستبعد':'gray','نشط':'green'};
function sbg(s){return bg(s,CLR[s]||'gray')}
function ab(label,act,arg,cls){
 var h='<button class="btn '+(cls||'bp')+' bx" data-act="'+act+'"';
 if(arg!==undefined&&arg!==null&&arg!=='')h+=' data-arg="'+arg+'"';
 return h+'>'+label+'</button>'}
function C(k,l){return{k:k,l:l}}
function F(k,l,t,opts,req,s2,ph){return{k:k,l:l,t:t,opts:opts||null,req:!!req,s2:!!s2,ph:ph||''}}
function pageH(t,s,a){return '<div class="ph"><div><h2>'+t+'</h2><p>'+s+'</p></div><div>'+(a||'')+'</div></div>'}
function card(t,b){return '<div class="card">'+(t?'<div class="chh">'+t+'</div>':'')+'<div class="cb">'+b+'</div></div>'}
function kpi(l,v,s,ic){
 return '<div class="kpi"><div style="font-size:20px">'+(ic||'📊')+'</div><div>'+
 '<div class="v">'+v+'</div><div class="l">'+l+'</div>'+
 (s?'<div class="s">'+s+'</div>':'')+'</div></div>'}
function deny(){return card('','<div style="text-align:center;padding:40px"><h3>🔒 لا تملك صلاحية الوصول لهذه الوحدة</h3><p class="mut" style="margin-top:6px">تواصل مع مدير النظام</p></div>')}
function openM(t,b,f,s){
 $('#mr').innerHTML='<div class="ov"><div class="dl'+(s?' '+s:'')+'">'+
 '<div class="dh"><h3>'+t+'</h3><button data-act="closeM">✕</button></div>'+
 '<div class="db">'+b+'</div>'+(f?'<div class="df">'+f+'</div>':'')+'</div></div>'}
function closeM(){$('#mr').innerHTML=''}
var CONF=null;
function ask(m,l,f){
 CONF=f;
 openM('تأكيد الإجراء','<p style="font-size:14px">'+m+'</p>',
 '<button class="btn bo" data-act="closeM">إلغاء</button>'+
 '<button class="btn bp" data-act="runC">'+(l||'تأكيد')+'</button>')}
function runC(){var f=CONF;CONF=null;closeM();if(f)f()}
var FORM=null;
function openForm(cfg){
 FORM=cfg;var h='';
 (cfg.fields||[]).forEach(function(x){
  var v=cfg.values?(cfg.values[x.k]==null?'':cfg.values[x.k]):'';
  var inp='';
  if(x.t==='select'){
   var os=(x.opts||[]).map(function(o){return(typeof o==='string')?{v:o,l:o}:o});
   inp='<select data-k="'+x.k+'"><option value="">— اختر —</option>';
   os.forEach(function(o){
    inp+='<option value="'+esc(o.v)+'"'+(String(o.v)===String(v)?' selected':'')+'>'+esc(o.l)+'</option>'});
   inp+='</select>'}
  else if(x.t==='textarea'){inp='<textarea data-k="'+x.k+'" rows="2">'+esc(v)+'</textarea>'}
  else{
   inp='<input type="'+(x.t||'text')+'" data-k="'+x.k+'" value="'+esc(v)+'"'+
   (x.t==='number'?' step="any"':'')+(x.ph?' placeholder="'+esc(x.ph)+'"':'')+'>'}
  h+='<div class="fi'+(x.s2?' s2':'')+'"><label>'+x.l+(x.req?' <b style="color:#dc2626">*</b>':'')+'</label>'+inp+'</div>'});
 openM(cfg.title,'<div class="fg" id="mf">'+h+'</div>',
 '<button class="btn bo" data-act="closeM">إلغاء</button>'+
 '<button class="btn bp" data-act="submitF">'+(cfg.ok||'حفظ')+'</button>',cfg.size)}
function submitF(){
 var c=FORM;if(!c)return;
 var v={},bad='';
 var els=$('#mf').querySelectorAll('[data-k]');
 for(var i=0;i<els.length;i++){
  var el=els[i],k=el.getAttribute('data-k'),val=el.value.trim(),f=null;
  for(var j=0;j<c.fields.length;j++){if(c.fields[j].k===k)f=c.fields[j]}
  if(f&&f.t==='number')val=(val==='')?0:+val;
  if(f&&f.req&&val==='')bad=bad||f.l;
  v[k]=val}
 if(bad){toast('حقل مطلوب: '+bad,'e');return}
 closeM();c.onSubmit(v)}
function mountT(id,cols,rows,opts){
 opts=opts||{};
 TB[id]={cols:cols,rows:rows,act:opts.act||null,actions:opts.actions||null,page:1,q:'',ps:opts.ps||12};
 drawT(id)}
function tSearch(el){
 var id=el.getAttribute('data-tid');
 var t=TB[id];
 if(t){t.q=el.value;t.page=1;drawT(id)}}
function tPage(s){
 var p=String(s).split('|');
 var t=TB[p[0]];
 if(t){t.page=+(p[1]||1);drawT(p[0])}}
function drawT(id){
 var t=TB[id],el=document.getElementById(id);
 if(!t||!el)return;
 var rows=(t.rows||[]).slice();
 if(t.q){
  var q=t.q.trim();
  rows=rows.filter(function(r){
   var s='';t.cols.forEach(function(c){s+=' '+(r[c.k]==null?'':r[c.k])});
   return s.indexOf(q)>-1})}
 var ps=t.ps||12,pages=Math.max(1,Math.ceil(rows.length/ps));
 if(t.page>pages)t.page=pages;
 var view=rows.slice((t.page-1)*ps,t.page*ps);
 var h='<div class="tb no-p"><input class="ts" placeholder="🔍 بحث..." value="'+esc(t.q)+
 '" data-tid="'+id+'" oninput="tSearch(this)"><span class="mut">'+fN(rows.length)+' سجل</span></div>';
 h+='<div class="tw"><table><thead><tr>';
 t.cols.forEach(function(c){h+='<th>'+c.l+'</th>'});
 if(t.actions)h+='<th>إجراءات</th>';
 h+='</tr></thead><tbody>';
 if(!view.length){
  h+='<tr><td colspan="'+(t.cols.length+(t.actions?1:0))+'" class="em">لا توجد بيانات مطابقة</td></tr>'}
 view.forEach(function(r){
  if(t.act)h+='<tr class="rl" data-act="'+t.act+'" data-arg="'+(r.id||'')+'">';
  else h+='<tr>';
  t.cols.forEach(function(c){h+='<td>'+(r[c.k]==null?'—':r[c.k])+'</td>'});
  if(t.actions)h+='<td class="ac">'+t.actions(r)+'</td>';
  h+='</tr>'});
 h+='</tbody></table></div>';
 if(pages>1){
  h+='<div class="pg no-p">';
  for(var i=1;i<=pages;i++){
   if(i===1||i===pages||Math.abs(i-t.page)<=2)
    h+='<button class="'+(i===t.page?'on':'')+'" data-act="tPage" data-arg="'+id+'|'+i+'">'+i+'</button>'}
  h+='</div>'}
 el.innerHTML=h}
function closestAct(el){
 while(el&&el!==document){
  if(el.getAttribute&&el.getAttribute('data-act'))return el;
  el=el.parentNode}
 return null}
document.addEventListener('click',function(e){
 var el=closestAct(e.target);
 if(!el)return;
 var act=el.getAttribute('data-act');
 var arg=el.getAttribute('data-arg');
 var fn=window[act];
 if(typeof fn==='function')fn(arg)});
document.addEventListener('change',function(e){
 var t=e.target;
 if(!t||!t.getAttribute)return;
 var setg=t.getAttribute('data-setg');
 if(setg){window[setg]=t.value;route();return}
 var set=t.getAttribute('data-set');
 if(set){
  var p=set.split('.');
  var obj=window[p[0]];
  if(obj&&p.length===2){obj[p[1]]=t.value;route()}}});
var ROLES={admin:'مدير النظام',mgmt:'الإدارة العليا',fleet:'مدير النقل والمعدات',pm:'مدير مشروع',eng:'مهندس موقع',maint:'مدير الصيانة',acct:'محاسب'};
var PERMS={
 admin:{m:'*',e:'*',a:'*',fin:true},

 .sort(function(x,y){return x.date<y.date?-1:1});

 if(!inP.length)return 0;
 var before=ops.filter(function(o){return o.date<f});

 var days=Math.max(0,(new Date(t)-new Date(f))/864e5+1),months=days/30.4;

function syncNow(){
 var n=DB.pendingSync.length;
 if(!n){toast('لا توجد سجلات معلقة');return}
 var ids=DB.pendingSync.map(function(o){return o.id}).join('، ');
 DB.pendingSync.forEach(function(o){o.src='هاتف-مزامنة';o.status='مقدمة';DB.operations.push(o)});
 DB.pendingSync=[];
 audit('مزامنة','تشغيل ميداني',ids,'تمت مزامنة '+n+' سجل — لم تُعتمد تلقائيًا');
 save();renderShell();route();
 toast('تمت مزامنة '+n+' سجلات — بانتظار المراجعة والاعتماد')}
function route(){
 if(!SESSION)return;
 var parts=(location.hash||'#/dashboard').replace(/^#\//,'').split('/');
 var mod=parts[0]||'dashboard';
 var nl=document.querySelectorAll('.nl');
 for(var i=0;i<nl.length;i++){
  nl[i].classList.toggle('on',nl[i].getAttribute('data-m')===(mod==='asset'?'assets':mod))}
 if(!allowed(mod)){
  $('#content').innerHTML=deny();$('#pgt').textContent='وصول ممنوع';window.scrollTo(0,0);return}
 $('#pgt').textContent=TITLES[mod]||mod;
 var FNS={dashboard:pgDashboard,alerts:pgAlerts,assets:pgAssets,projects:pgProjects,
  contracts:pgContracts,requests:pgRequests,assignments:pgAssignments,operations:pgOperations,
  trips:pgTrips,drivers:pgDrivers,plans:pgPlans,maintenance:pgMaint,oils:pgOils,tires:pgTires,
  fuel:pgFuel,inventory:pgInv,movements:pgMoves,purchases:pgPurch,costs:pgCosts,
  charging:pgCharging,invoices:pgInvoices,customers:pgCustomers,reports:pgReports,
  users:pgUsers,audit:pgAudit,settings:pgSettings};
 var fn;
 if(mod==='asset'){fn=function(){pgAsset(parts[1])}}
 else{fn=FNS[mod]||pgDashboard}
 if(!fn||typeof fn!=='function'){
  $('#content').innerHTML=card('','<p style="padding:30px;text-align:center">⚠ وحدة <b>'+mod+
  '</b> لم تُحمَّل — راجع شريط الأخطاء أعلى الصفحة</p>');
  window.scrollTo(0,0);return}
 try{fn()}
 catch(e){
  $('#content').innerHTML=card('',
  '<b style="color:#b91c1c">خطأ في عرض الصفحة:</b>'+
  '<pre style="white-space:pre-wrap;font-size:12px">'+esc(e.message)+'</pre>'+
  '<p class="mut">إن استمر الخطأ جرّب تصفير البيانات من الإعدادات.</p>')}
 window.scrollTo(0,0)}

 audit('خروج','جلسة',SESSION.username,'');

function topUse(A,f,t){
 var rows=[];
 A.forEach(function(a){rows.push({c:a.code,n:a.name,h:aCost(a,f,t).hours})});
 rows.sort(function(x,y){return y.h-x.h});
 var top=rows.slice(0,6),h='<table class="mn"><tbody>';
 top.forEach(function(r){
  h+='<tr><td>'+r.c+' — '+esc(r.n)+'</td><td>'+fN(r.h)+' ساعة</td></tr>'});
 return h+'</tbody></table>'}

 h+=kpi('صيانة وإصلاح',fN(cnt('تحت الصيانة')+cnt('بانتظار الإصلاح')+cnt('بانتظار الفحص')),

 if(hasFin())h+=kpi('التحميل الداخلي 30 يوم',fM(chg),
  'ساعات معتمدة '+fN(T.hours)+' • الفارق '+fM(T.total-chg),'📊');
 h+='</div><div class="g3">';

 if(alerts.length){
  alh='<div class="al">'+alerts.slice(0,7).map(function(a){
   return '<a class="ai sev'+(a.sev==='عالي'?1:(a.sev==='متوسط'?2:3))+'" href="'+a.href+'">'+
   '<b>'+a.title+'</b><span>'+esc(a.entity)+'</span><span class="mut">'+esc(a.det)+'</span></a>'}).join('')+'</div>'+
  '<a class="alnk" href="#/alerts">عرض كل التنبيهات ←</a>'}
 h+=card('التنبيهات الحالية ('+alerts.length+')',alh);
 h+=card('بانتظار الاعتمادات','<div class="pl">'+
 '<a href="#/requests"><span>طلبات معدات معلقة</span>'+bg(pendRq,'blue')+'</a>'+

 '<a href="#/purchases"><span>طلبات شراء قيد الاعتماد</span>'+
 bg(DB.purchaseReqs.filter(function(p){return p.status==='قيد الاعتماد'}).length,'blue')+'</a></div>');
 h+='</div><div class="g2">';
 if(hasFin())h+=card('تكلفة التشغيل حسب المشروع 30 يوم','<canvas id="ch-prj" height="225"></canvas>');
 else h+=card('أعلى الأصول استخدامًا بالساعات',topUse(A,f,t));
 h+=card('اتجاه الوقود والصيانة 6 أشهر','<canvas id="ch-tr" height="225"></canvas>');
 h+='</div><div class="g2">';
 var eh='<table class="mn"><tbody>';
 ending.forEach(function(c){
  var d=dLeft(c.end);

 eh+='</tbody></table><a class="alnk" href="#/contracts">كل العقود ←</a>';

 DB.workOrders.filter(function(w){return w.status!=='مكتمل'&&w.status!=='ملغى'}).length+'</td></tr>'+

 $('#content').innerHTML=h;
 if(window.Chart){

   chart('ch-prj',{type:'bar',

     borderColor:'#d97706',backgroundColor:'rgba(217,119,6,.1)',fill:true,tension:.35}]},
   options:{plugins:{legend:{position:'bottom'}}}})}}
function pgAlerts(){
 var A=genAlerts();
 var G={'عالي':[],'متوسط':[],'منخفض':[]};
 A.forEach(function(a){if(G[a.sev])G[a.sev].push(a)});
 var h=pageH('التنبيهات والاستحقاقات','محرك تنبيهات موحد — '+A.length+' تنبيه نشط');
 h+='<div class="kg">';
 h+=kpi('عالية الخطورة',fN(G['عالي'].length),'إجراء فوري','🔴');
 h+=kpi('متوسطة',fN(G['متوسط'].length),'مراجعة قريبة','🟠');
 h+=kpi('منخفضة',fN(G['منخفض'].length),'متابعة','🟡');
 h+=kpi('قواعد التنبيه','—',
  'أيام: '+DB.settings.alertDays+' • كم: '+fN(DB.settings.alertKm)+' • ساعة: '+fN(DB.settings.alertHours),'⚙️');
 h+='</div>';
 ['عالي','متوسط','منخفض'].forEach(function(s){
  if(!G[s]||!G[s].length)return;
  var title='تنبيهات '+(s==='عالي'?'عالية الخطورة':s);
  var sevN=(s==='عالي')?1:(s==='متوسط'?2:3);
  var ih='<div class="al">'+G[s].map(function(a){
   return '<div class="ai sev'+sevN+'">'+
   '<div><b>'+a.title+'</b> — '+esc(a.entity)+'<div class="mut">'+esc(a.det)+'</div></div>'+
   '<div style="display:flex;gap:6px;margin-top:4px">'+
   '<a class="btn bo bx" href="'+a.href+'">معالجة</a>'+
   '<button class="btn bo bx" data-act="dismissA" data-arg="'+a.key+'">إغلاق</button></div></div>'}).join('')+'</div>';
  h+=card(title,ih)});
 $('#content').innerHTML=h}

function tireDo(tireId,op){
 var t=byId(DB.tires,tireId);
 if(!t)return;
 var needAsset=(op==='تركيب'||op==='تدوير'||op==='فك');
 var fields=[];
 if(needAsset)fields.push(F('asset','الأصل','select',asOpts(),1));
 if(op==='تركيب'||op==='تدوير')
  fields.push(F('position','موضع التركيب',null,null,0,0,'أمامي يمين / خلفي أيسر...'));
 fields.push(F('date','التاريخ','date',null,1));
 fields.push(F('cost','تكلفة العملية ج','number'));
 if(op==='استبدال')fields.push(F('reason','سبب الإخراج من الخدمة',null,null,1));
 fields.push(F('notes','ملاحظات','textarea',null,0,1));
 openForm({title:op+' — إطار '+t.code,fields:fields,
  onSubmit:function(v){
   v.cost=+v.cost||0;
   DB.tireOps.push({id:uid('TO'),tire:tireId,op:op,date:v.date,
    asset:(v.asset||t.asset),position:(v.position||t.position),
    cost:v.cost,notes:v.notes||''});
   if(op==='تركيب'){
    t.status='بالخدمة';t.asset=v.asset;t.position=v.position||t.position;
    t.install=v.date;
    var a=asset(v.asset);
    t.meterAt=a?a.meter:0}
   if(op==='تدوير')t.position=v.position||t.position;
   if(op==='فك'){t.status='مخزن';t.asset='';t.position='';t.install=''}
   if(op==='فحص')t.status='بالخدمة';
   if(op==='استبدال'){t.status='مستبعد';t.reason=v.reason}
   audit(op,'إطار',t.code,'تكلفة '+fM(v.cost));
  save();route();toast('تم تسجيل عملية '+op);}});}

/* ===== التقارير: دوال مستقلة ثم سجل بسيط ===== */
var REP='all',RF={from:addD(today(),-29),to:today(),cat:'',own:'',st:'',proj:''},CUR=null;
function aFlt(a){
 return(!RF.cat||a.cat===RF.cat)&&(!RF.own||a.own===RF.own)&&
 (!RF.st||a.status===RF.st)&&(!RF.proj||a.proj===RF.proj)}
function baseRow(a){
 var c=aCost(a,RF.from,RF.to);
 var ch=chargeFor(a,RF.from,RF.to);
 return{id:a.id,code:a.code,name:esc(a.name),cat:a.cat,type:a.type,own:sbg(a.own),
 proj:(a.proj?projN(a.proj):'المقر'),status:sbg(a.status),
 h:fN(c.hours),k:fN(c.km),f:finv(fM(c.fuel)),m:finv(fM(c.maint)),
 r:finv(fM(c.rental)),d:finv(fM(c.dep)),t:finv(fM(c.total)),
 ch:finv(fM(ch.amount)),v:finv(fM(ch.amount-c.total))}}
function baseCols(){
 return[C('code','الكود'),C('name','الأصل'),C('cat','الفئة'),C('type','النوع'),
 C('own','الملكية'),C('proj','المشروع'),C('status','الحالة'),
 C('h','ساعات فترة'),C('k','مسافة فترة'),C('f','وقود'),C('m','صيانة'),
 C('r','إيجار مستحق'),C('d','إهلاك'),C('t','إجمالي التكلفة'),
 C('ch','التحميل الداخلي'),C('v','الفارق')]}
function rptAll(){
 return{cols:baseCols(),rows:DB.assets.filter(aFlt).map(baseRow),act:'gotoAsset'}}
function rptOwned(){
 var rows=DB.assets.filter(function(a){return aFlt(a)&&a.own==='مملوك'}).map(function(a){
  var r=baseRow(a);
  r.capex=fM(a.capex);
  r.acc=fM(depAcc(a));
  r.nbv=fM(Math.max(0,(+a.capex||0)-depAcc(a)));
  return r});
 var cols=baseCols().concat([C('capex','القيمة الرأسمالية'),
  C('acc','مجمع الإهلاك'),C('nbv','صافي القيمة الدفترية')]);
 return{cols:cols,rows:rows,act:'gotoAsset'}}
function rptRented(){
 var rows=DB.assets.filter(function(a){return aFlt(a)&&a.own==='مستأجر'}).map(function(a){
  var c=conOf(a);
  var d=c?dLeft(c.end):null;
  var dl='—';
  if(c)dl=(d<=0?bg('منتهي','red'):bg(d+' يوم',d<=30?'orange':'green'));
  return{id:a.id,code:a.code,name:esc(a.name),
  lessor:(c?esc(c.lessor):'—'),no:(c?c.number:'—'),end:(c?fD(c.end):'—'),dl:dl,
  rate:(c?fM(c.rate)+' / '+c.unit:'—'),
  ft:(c?c.fuelT:'—'),ot:(c?c.operT:'—'),
  h:fN(apprH(a,RF.from,RF.to)),
  rental:finv(fM(rentalAcc(a,RF.from,RF.to))),
  fuel:finv(fM(aCost(a,RF.from,RF.to).fuel))}});
 var cols=[C('code','الأصل'),C('name',''),C('lessor','المؤجر'),C('no','العقد'),
 C('end','نهاية العقد'),C('dl','المتبقي'),C('rate','قيمة/وحدة'),C('ft','شروط الوقود'),
 C('ot','المشغل'),C('h','استخدام فعلي'),C('rental','إيجار مستحق'),C('fuel','وقود على الشركة')];
 return{cols:cols,rows:rows,act:'gotoAsset'}}
function rptVeh(){
 var rows=DB.assets.filter(function(a){
  return aFlt(a)&&(a.cat==='سيارات خفيفة'||a.cat==='مركبات نقل')}).map(function(a){
  var c=aCost(a,RF.from,RF.to);
  var act=(c.km>0)?(c.qty/c.km*100):0;
  var dev=(c.km>0&&a.std)?((act-a.std)/a.std*100):null;
  var devB=(dev==null)?'—':bg(fN(dev,0)+'%',dev>20?'red':(dev>10?'orange':'green'));
  return{id:a.id,code:a.code,name:esc(a.name),plate:(a.plate||'—'),
  proj:(a.proj?projN(a.proj):'المقر'),odo:fN(a.meter),k:fN(c.km),q:fN(c.qty),
  act:(c.km?fN(act,1):'—'),std:fN(a.std,1),dev:devB,t:finv(fM(c.total))}});
 var cols=[C('code','الكود'),C('name','المركبة'),C('plate','اللوحة'),C('proj','المشروع'),
 C('odo','العداد كم'),C('k','مسافة الفترة'),C('q','وقود لتر'),C('act','فعلي ل/100كم'),
 C('std','معياري'),C('dev','الانحراف'),C('t','إجمالي التكلفة')];
 return{cols:cols,rows:rows,act:'gotoAsset'}}
function rptEq(){
 var rows=DB.assets.filter(function(a){
  return aFlt(a)&&(a.cat==='معدات ثقيلة'||a.cat==='مولدات'||a.cat==='معدات خفيفة')})
  .map(function(a){
   var c=aCost(a,RF.from,RF.to);
   return{id:a.id,code:a.code,name:esc(a.name),type:a.type,
   proj:(a.proj?projN(a.proj):'المقر'),h0:fN(a.meter),h:fN(c.hours),
   dn:fN(c.down),q:fN(c.qty),t:finv(fM(c.total)),
   cph:(c.hours?finv(fM(c.total/c.hours)):'—'),
   ch:finv(fM(chargeFor(a,RF.from,RF.to).amount))}});
 var cols=[C('code','الكود'),C('name','المعدة'),C('type','النوع'),C('proj','المشروع'),
 C('h0','ساعات تراكمية'),C('h','ساعات الفترة'),C('dn','ساعات توقف'),C('q','وقود لتر'),
 C('t','إجمالي التكلفة'),C('cph','تكلفة الساعة'),C('ch','التحميل')];
 return{cols:cols,rows:rows,act:'gotoAsset'}}
function rptContracts(){
 var rows=DB.contracts.map(function(c){
  var d=dLeft(c.end);
  return{id:c.id,number:c.number,lessor:esc(c.lessor),asset:assetL(c.assets[0]),
  start:fD(c.start),end:fD(c.end),
  dl:(d<=0?bg('منتهي','red'):bg(d+' يوم',d<=30?'orange':'green')),
  rate:fM(c.rate)+' / '+c.unit,
  minimum:(c.minimum?fN(c.minimum)+' '+c.unit:'—'),
  fu:c.fuelT,op:c.operT,status:sbg(c.status),
  inv:fN(DB.invoices.filter(function(i){return i.link.indexOf(c.number)>-1}).length)}});
 var cols=[C('number','العقد'),C('lessor','المؤجر'),C('asset','الأصل'),C('start','البداية'),
 C('end','النهاية'),C('dl','المتبقي'),C('rate','القيمة/الوحدة'),C('minimum','الحد الأدنى'),
 C('fu','الوقود'),C('op','المشغل'),C('status','الحالة'),C('inv','فواتير العقد')];
 return{cols:cols,rows:rows}}
function rptDue(){
 var rows=[];
 DB.plans.forEach(function(p){
  var a=asset(p.asset);
  if(!a||!aFlt(a))return;
  var rule=[p.everyKm?fN(p.everyKm)+' كم':null,
   p.everyHours?fN(p.everyHours)+' س':null,
   p.everyDays?p.everyDays+' يوم':null].filter(Boolean);
  rows.push({id:p.id,kind:bg('صيانة','blue'),asset:assetL(p.asset),name:esc(p.name),
   rule:(rule.length?rule.join(' / '):'—'),last:fD(p.lastDate),
   nx:nxBadge(planNx(p)),resp:esc(p.resp)})});
 DB.oilPlans.forEach(function(p){
  var a=asset(p.asset);
  if(!a||!aFlt(a))return;
  var rule=[p.everyKm?fN(p.everyKm)+' كم':null,
   p.everyHours?fN(p.everyHours)+' س':null].filter(Boolean);
  rows.push({id:p.id,kind:bg('زيوت وفلاتر','purple'),asset:assetL(p.asset),name:esc(p.item),
   rule:(rule.length?rule.join(' / '):'—'),last:fD(p.lastDate),
   nx:nxBadge(planNx(p)),resp:'—'})});
 var cols=[C('kind','النوع'),C('asset','الأصل'),C('name','الخطة أو المادة'),
 C('rule','قاعدة الاستحقاق'),C('last','آخر تنفيذ'),C('nx','الاستحقاق القادم'),C('resp','المسؤول')];
 return{cols:cols,rows:rows}}
function rptFuel(){
 var rows=DB.assets.filter(aFlt).map(function(a){
  var c=aCost(a,RF.from,RF.to);
  var act=(a.mt==='كم')?(c.km?fN(c.qty/c.km*100,1)+' ل/100كم':'—')
   :(c.hours?fN(c.qty/c.hours,1)+' ل/س':'—');
  return{id:a.id,code:a.code,name:esc(a.name),q:fN(c.qty),f:finv(fM(c.fuel)),
  u:((a.mt==='كم')?fN(c.km)+' كم':fN(c.hours)+' ساعة'),
  act:act,std:(a.std?fN(a.std,1):'—')}});
 var cols=[C('code','الأصل'),C('name',''),C('q','كمية لتر'),C('f','تكلفة'),
 C('u','الاستخدام'),C('act','الاستهلاك الفعلي'),C('std','المعياري')];
 return{cols:cols,rows:rows,act:'gotoAsset'}}
function rptInvn(){
 var rows=DB.items.map(function(i){
  return{id:i.id,code:i.code,name:esc(i.name),cat:i.cat,unit:i.unit,
  qty:fN(i.qty),min:fN(i.min),
  st:((i.qty<i.min)?bg('إعادة طلب','red'):bg('طبيعي','green')),
  cost:fM(i.cost),val:finv(fM(i.qty*i.cost))}});
 var cols=[C('code','الكود'),C('name','الصنف'),C('cat','التصنيف'),C('unit','الوحدة'),
 C('qty','الرصيد'),C('min','الحد الأدنى'),C('st','الحالة'),C('cost','تكلفة الوحدة'),
 C('val','قيمة الرصيد')];
 return{cols:cols,rows:rows}}
function rptAppr(){
 var rows=[];
 DB.requests.forEach(function(r){
  if(r.status==='بانتظار اعتماد مدير المشروع'||r.status==='معتمد من مدير المشروع')
   rows.push({id:r.id,kind:bg('طلب معدات','blue'),ref:r.number,who:esc(r.req),
    date:fD(r.date),status:sbg(r.status),days:fN(-dLeft(r.date))})});
 DB.operations.forEach(function(o){
  if(o.status==='مقدمة')
   rows.push({id:o.id,kind:bg('سجل تشغيل','blue'),ref:assetL(o.assetId),
    who:esc(drvN(o.drv)),date:fD(o.date),status:sbg(o.status),days:fN(-dLeft(o.date))})});
 DB.workOrders.forEach(function(w){
  if(w.status==='بانتظار الاعتماد')
   rows.push({id:w.id,kind:bg('أمر عمل','orange'),ref:w.id,who:'—',
    date:fD(w.opened),status:sbg(w.status),days:fN(-dLeft(w.opened))})});
 DB.invoices.forEach(function(x){
  if(x.status==='مسجلة'||x.status==='بانتظار مراجعة')
   rows.push({id:x.id,kind:bg('فاتورة','orange'),ref:x.number,who:esc(x.party),
    date:fD(x.date),status:sbg(x.status),days:fN(-dLeft(x.date))})});
 var cols=[C('kind','النوع'),C('ref','المرجع'),C('who','الجهة أو المستخدم'),
 C('date','التاريخ'),C('status','الحالة'),C('days','معلق منذ يوم')];
 return{cols:cols,rows:rows}}
var REPORTS={
 all:{l:'التقرير الشامل لجميع الأصول',b:rptAll},
 owned:{l:'الأصول المملوكة والإهلاك والقيمة الدفترية',b:rptOwned},
 rented:{l:'الأصول المستأجرة والعقود',b:rptRented},
 veh:{l:'السيارات والمركبات مع الاستهلاك',b:rptVeh},
 eq:{l:'المعدات والمولدات مع تكلفة الساعة',b:rptEq},
 contracts:{l:'عقود الإيجار',b:rptContracts},
 due:{l:'الاستحقاقات: الصيانة والزيوت',b:rptDue},
 fuel:{l:'الوقود: الاستهلاك والتكلفة',b:rptFuel},
 invn:{l:'المخزون وقطع الغيار',b:rptInvn},
 appr:{l:'الموافقات المعلقة',b:rptAppr}};
function pgReports(){
 var h=pageH('مركز التقارير',
  'تقارير إجمالية وتحليلية قابلة للتصفية — الانتقال للتفاصيل والتصدير إلى Excel وطباعة PDF');
 h+='<div class="fb no-p"><select data-setg="REP">'+
 Object.keys(REPORTS).map(function(k){
  return '<option value="'+k+'"'+(REP===k?' selected':'')+'>'+REPORTS[k].l+'</option>'}).join('')+

 '<span class="lb">من</span><input type="date" value="'+RF.from+'" data-set="RF.from">'+

 '<select data-set="RF.cat"><option value="">كل الفئات</option>'+
 CATS.map(function(c){return '<option'+(RF.cat===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select>'+
 '<select data-set="RF.own"><option value="">الملكية: الكل</option>'+

 '<option'+(RF.own==='مستأجر'?' selected':'')+'>مستأجر</option></select>'+

 ['متاح','مخصص لمشروع','يعمل','تحت الصيانة','متوقف مؤقتًا','بانتظار الإصلاح'].map(function(s){
  return '<option'+(RF.st===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select>'+
 '<select data-set="RF.proj"><option value="">كل المشروعات</option>'+
 DB.projects.map(function(p){
  return '<option value="'+p.id+'"'+(RF.proj===p.id?' selected':'')+'>'+p.name+'</option>'}).join('')+'</select>'+
 ab('تشغيل التقرير','runRep')+
 ab('تصدير Excel','expCSV','','bo')+
 ab('طباعة','printPage','','bo')+
 '</div><div id="tb-rep"></div><div id="rmeta"></div>';
 $('#content').innerHTML=h;
 runRep()}
function runRep(){
 var R=byField(REPORTS,'l',null)||REPORTS[REP];
 R=REPORTS[REP];
 if(!R)return;
 var out=R.b();
 CUR={title:R.l,cols:out.cols,rows:out.rows};
 mountT('tb-rep',out.cols,out.rows,{ps:14,act:(out.act||null)});
 var m=$('#rmeta');
 if(m){
  m.innerHTML='<div class="rm">تقرير: <b>'+R.l+'</b> — الفترة: '+fD(RF.from)+' ← '+fD(RF.to)+
  ' — السجلات: '+fN(out.rows.length)+' — استُخرج: '+fDT(new Date())+
  ' — بواسطة: '+SESSION.name+' — الأعمدة المالية من البيانات المعتمدة'+
  (hasFin()?'':' مقيّدة بصلاحيتك')+'</div>'}}
function expCSV(){
 if(!CUR){toast('شغّل التقرير أولًا','w');return}
 var strip=function(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').trim()};
 var L=[CUR.cols.map(function(c){return '"'+c.l+'"'}).join(',')];
 CUR.rows.forEach(function(r){
  var line=[];
  CUR.cols.forEach(function(c){line.push('"'+strip(r[c.k]).replace(/"/g,'""')+'"')});
  L.push(line.join(','))});
 var blob=new Blob(['\uFEFF'+L.join('\n')],{type:'text/csv;charset=utf-8'});
 var a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='report-'+REP+'.csv';a.click();
 audit('تصدير تقرير','تقرير',CUR.title,'');
 toast('تم التصدير — يفتح مباشرة في Excel')}
function printPage(){window.print()}

 var req=['pgDashboard','pgAlerts','pgAssets','pgAsset','pgProjects','pgContracts',
  'pgRequests','pgAssignments','pgOperations','pgTrips','pgDrivers','pgPlans','pgMaint',
  'pgOils','pgTires','pgFuel','pgInv','pgMoves','pgPurch','pgCosts','pgCharging',
  'pgInvoices','pgCustomers','pgReports','pgUsers','pgAudit','pgSettings',
  'rptAll','rptOwned','rptRented','rptVeh','rptEq','rptContracts','rptDue','rptFuel','rptInvn','rptAppr'];
 var missing=[];
 req.forEach(function(f){if(typeof window[f]!=='function')missing.push(f)});
 if(missing.length){
  var b=document.getElementById('errbar');
  if(b){b.style.display='block';b.textContent='⚠ وحدات لم تُحمَّل: '+missing.join('، ')}}
 if(SESSION){renderShell();route()}
 else renderLogin();
 window.addEventListener('hashchange',route);
})();
